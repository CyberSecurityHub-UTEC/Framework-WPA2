[project]
name = "csh-wpa2-framework"
version = "2.0.0"
description = "Consola visual de laboratorio para auditoría WPA/WPA2 (CSH Framework)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
csh-console = "csh_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["csh_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Evita el PytestDeprecationWarning fijando el scope del loop de fixtures async.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# -q: salida compacta | -ra: resumen de todo lo que no sea "passed"
addopts = "-q -ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade
select = ["E", "F", "I", "W", "UP"]
# E501 (largo de línea) y E702 (; en una línea) se ignoran a propósito: la TUI
# usa un estilo compacto deliberado (f-strings de markup, op.append encadenados).
# Se conservan las reglas de valor real (F = bugs de pyflakes, I, UP, W).
ignore = ["E501", "E702"]
