[project]
name = "csh-wpa2-framework"
version = "2.0.0"
description = "Consola visual de laboratorio para auditoría WPA/WPA2 (CSH Framework)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
]

[project.scripts]
csh-console = "csh_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["csh_tui"]
