name: CI

# Corre en cualquier push y en cualquier pull_request (y explicitamente hacia main).
# Las pruebas mockean todas las llamadas a subprocess (airodump-ng, etc.),
# por lo que NO se requieren herramientas wifi ni root en CI.
on:
  push:
    branches:
      - "**"
      - main
  pull_request:
    branches:
      - "**"
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: pip install -e ".[dev]"
      # Mientras tests/ este vacio, pytest sale con codigo 5 ("no tests collected").
      # Lo tratamos como aceptable para no bloquear el pipeline en el arranque.
      # Cuando existan pruebas reales, este paso fallara de verdad si rompen.
      - name: Pytest + coverage
        run: |
          code=0
          pytest -q --cov=csh_tui --cov-report=term-missing || code=$?
          if [ "$code" -eq 5 ]; then
            echo "::warning::No se recolectaron pruebas todavia (tests/ vacio). OK por ahora."
            exit 0
          fi
          exit "$code"
